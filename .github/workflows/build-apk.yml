name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug --no-daemon

      - name: Check refreshed art is inside the APK
        run: |
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -1)
          echo "repo  status_pane: $(sha256sum core/src/main/assets/interfaces/status_pane.png | cut -c1-12)"
          echo "apk   status_pane: $(unzip -p "$APK" assets/interfaces/status_pane.png | sha256sum | cut -c1-12)"
          echo "version: $(unzip -p "$APK" AndroidManifest.xml | strings | grep -m1 -o '4\.0\.2[^ ]*' || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: SureShotDungeon-build-${{ github.run_number }}
          path: android/build/outputs/apk/debug/*.apk
