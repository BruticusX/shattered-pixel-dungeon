name: Compile check (dev)

on:
  push:
    branches: [dev]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile game code only (no APK)
        run: |
          chmod +x gradlew
          ./gradlew core:compileJava android:compileDebugJavaWithJavac --no-daemon -q
